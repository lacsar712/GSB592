services:
  mysql:
    image: mysql:8.0
    container_name: huangshan-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: huangshan_db
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - '3306:3306'
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - huangshan-network
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-p123456']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: huangshan-backend
    ports:
      - '8080:8080'
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: huangshan_db
      DB_USERNAME: root
      DB_PASSWORD: 123456
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - huangshan-network
    restart: on-failure

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: huangshan-frontend
    ports:
      - '3000:3000'
    depends_on:
      - backend
    networks:
      - huangshan-network

volumes:
  mysql-data:

networks:
  huangshan-network:
    driver: bridge
